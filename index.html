<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuddigang Family World Cup 2026 Sweepstakes</title>
    
    <!-- Tailwind CSS for easy styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        /* Simple Canvas Wheel Rotation */
        #wheel {
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1);
        }
        /* Celebration pop-in effect */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <header class="text-center my-6">
        <h1 class="text-3xl font-extrabold text-blue-600">🏆 Cuddigang Family World Cup 2026 🏆</h1>
        <p class="text-slate-500 text-sm mt-1 font-medium">Sweepstakes Wheel of Destiny</p>
    </header>

    <main class="w-full max-w-md bg-white rounded-2xl p-6 shadow-xl border border-slate-200">
        <!-- Step 1: Select Name -->
        <div id="setup-section" class="space-y-4">
            <label for="family-select" class="block text-lg font-medium text-slate-700">Who is spinning?</label>
            <select id="family-select" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">-- Select Your Name --</option>
            </select>
            <button id="start-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition disabled:opacity-40" disabled>
                Proceed to Wheel
            </button>
        </div>

        <!-- Step 2: The Wheel (Hidden initially) -->
        <div id="wheel-section" class="hidden flex flex-col items-center space-y-6">
            <h2 id="welcome-user" class="text-xl font-bold text-center text-blue-600"></h2>
            <p id="user-status" class="text-sm text-slate-500 text-center font-medium px-2"></p>
            
            <!-- Wheel Container -->
            <div class="relative w-72 h-72 flex items-center justify-center">
                <!-- Pointer -->
                <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[30px] border-t-red-500 z-10"></div>
                <canvas id="wheel" width="280" height="280" class="rounded-full shadow-lg"></canvas>
            </div>

            <button id="spin-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-lg text-lg shadow-md transform active:scale-95 transition disabled:opacity-40">
                SPIN THE WHEEL!
            </button>

            <!-- Back navigation link -->
            <button id="back-btn" class="text-sm font-semibold text-blue-600 hover:text-blue-800 hover:underline transition mt-2">
                ← Change User / View Board
            </button>
        </div>

        <!-- Step 3: Result Modal/Text -->
        <div id="result-section" class="hidden text-center space-y-4 pt-4 border-t border-slate-200 mt-4 animate-pop">
            <h3 class="text-xl font-semibold text-slate-700">🎉 You Drew:</h3>
            <div id="drawn-team-display" class="text-3xl font-black text-emerald-600 tracking-wide uppercase"></div>
            <p id="rule-notice" class="text-sm italic text-amber-600 font-medium px-2"></p>
        </div>
    </main>

    <!-- Live Board -->
    <section class="w-full max-w-md mt-6 bg-white rounded-2xl p-6 shadow-xl border border-slate-200">
        <h3 class="text-xl font-bold text-blue-600 mb-4 border-b border-slate-200 pb-2">Live Board</h3>
        <ul id="leaderboard" class="divide-y divide-slate-100 max-h-60 overflow-y-auto pr-2 space-y-2">
            <!-- Dynamically populated -->
        </ul>
    </section>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ REPLACE THIS WITH YOUR FIREBASE CONFIGURATION OBTAINED FROM THE CONSOLE
        const firebaseConfig = {
              apiKey: "AIzaSyA_sbYwjuOpceCPbbDu_ziBdjZsolf_jlQ",
              authDomain: "cuddigang-family-sweepstakes.firebaseapp.com",
              databaseURL: "https://cuddigang-family-sweepstakes-default-rtdb.europe-west1.firebasedatabase.app",
              projectId: "cuddigang-family-sweepstakes",
              storageBucket: "cuddigang-family-sweepstakes.firebasestorage.app",
              messagingSenderId: "875734381087",
              appId: "1:875734381087:web:98c3f8eeeaaa941790db2a"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- GAME CONFIGURATION ---
        const familyMembers = [
            "Andrew", "Catherina", "Chris", "Declan", "Deedee", "Emily", 
            "Eoin the Elder", "Eoin the Younger", "Frederic", "Harry", "Issy", "Jackie", 
            "James Cud", "James OC", "John", "Leo", "Lucy", "Maeve", 
            "Margaret", "Maurice", "Michael", "Michelle", "Neville", "Orlaith", 
            "Patrick", "Sadie", "Yvonne"
        ].sort();

        const qualifiedTeamsByOdds = [
              "Spain",                 // Co-Favorite (+450)
              "France",                // Co-Favorite (+470)
              "England",               // Third Favorite (+650)
              "Brazil",                // (+850)
              "Portugal",              // (+900)
              "Argentina",             // Defending Champions (+950)
              "Germany",               // (+1400)
              "Netherlands",           // (+1700)
              "Belgium",               // (+2200)
              "Norway",                // (+3300)
              "Japan",                 // Top AFC Choice (+3500)
              "Colombia",              // (+4000)
              "United States",         // Co-Host (+5000)
              "Morocco",               // Top CAF Choice (+5500)
              "Mexico",                // Co-Host (+5500)
              "Uruguay",               // (+5500)
              "Switzerland",           // (+7500)
              "Türkiye",               // (+8000)
              "Croatia",               // (+8000)
              "Ecuador",               // (+8000)
              "Austria",               // (+10000)
              "Senegal",               // (+15000)
              "Canada",                // Co-Host (+17500)
              "Sweden",                // (+17500)
              "Scotland",              // (+17500)
              "Côte d'Ivoire",         // (+20000)
              "Paraguay",              // (+20000)
              "Algeria",               // (+25000)
              "Egypt",                 // (+40000)
              "Ghana",                 // (+40000)
              "Korea Republic",        // (+40000)
              "Czechia",               // (+50000)
              "IR Iran",               // (+50000)
              "Bosnia and Herzegovina",// (+50000)
              "Tunisia",               // (+150000)
              
              // Massive Underdog Tier (Consensus +250000 Longshots)
              "Australia",
              "Cape Verde",
              "Congo DR",
              "Curaçao",
              "Haiti",
              "Iraq",
              "Jordan",
              "New Zealand",
              "Panama",
              "Qatar",
              "Saudi Arabia",
              "South Africa",
              "Uzbekistan"
            ];
        
        // Top 6 Powerhouses (Automatic 1-Team Cap)
        const top6Teams = ["Argentina", "France", "Brazil", "England", "Spain", "Portugal"];

        // Tier 1: Top 24 Teams total (The 6 Powerhouses + Next 18 Strongest)
        const tier1Teams = [
            ...top6Teams,
            "Germany", "Netherlands", "Belgium", "Norway", "Japan", "Colombia",
            "United States", "Morocco", "Mexico", "Uruguay", "Switzerland", "Türkiye",
            "Croatia", "Ecuador", "Austria", "Senegal", "Canada", "Sweden"
        ];

        // Tier 2: Bottom 24 Teams (The Longshots)
        const tier2Teams = [
            "Scotland", "Côte d'Ivoire", "Paraguay", "Algeria", "Egypt", "Ghana", 
            "Korea Republic", "Czechia", "IR Iran", "Bosnia and Herzegovina", "Tunisia", "Australia",
            "Cape Verde", "Congo DR", "Curaçao", "Haiti", "Iraq", "Jordan",
            "New Zealand", "Panama", "Qatar", "Saudi Arabia", "South Africa", "Uzbekistan"
        ];

        // Complete pooled array
        const allTeams = [...tier1Teams, ...tier2Teams];

        // State Variables
        let availableTeams = [...allTeams];
        let currentDBState = {};
        let selectedUser = "";
        let isSpinning = false;

        // DOM Elements
        const familySelect = document.getElementById('family-select');
        const startBtn = document.getElementById('start-btn');
        const setupSection = document.getElementById('setup-section');
        const wheelSection = document.getElementById('wheel-section');
        const welcomeUser = document.getElementById('welcome-user');
        const userStatus = document.getElementById('user-status');
        const spinBtn = document.getElementById('spin-btn');
        const backBtn = document.getElementById('back-btn');
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const resultSection = document.getElementById('result-section');
        const drawnTeamDisplay = document.getElementById('drawn-team-display');
        const ruleNotice = document.getElementById('rule-notice');
        const leaderboard = document.getElementById('leaderboard');

        // Populate Dropdown
        familyMembers.forEach(member => {
            const opt = document.createElement('option');
            opt.value = member;
            opt.textContent = member;
            familySelect.appendChild(opt);
        });

        familySelect.addEventListener('change', (e) => {
            selectedUser = e.target.value;
            startBtn.disabled = !selectedUser;
        });

        // Initialize/Sync Database in Real-time
        onValue(ref(db, 'draws'), (snapshot) => {
            currentDBState = snapshot.val() || {};
            if (!isSpinning) {
                updateAvailableTeams();
                renderLeaderboard();
                updateUserFlowStatus();
            }
        });

        // Calculate available teams globally and filter based on user-specific tier locks
        function updateAvailableTeams() {
            // 1. Gather all teams already claimed globally across the family
            const takenTeams = [];
            Object.values(currentDBState).forEach(userDraws => {
                if (userDraws.teams) takenTeams.push(...userDraws.teams);
            });

            // 2. Base filter: baseline available pool
            let pool = allTeams.filter(team => !takenTeams.includes(team));

            // 3. Tier Balance Filter: If a specific user is active and on spin #2, restrict the pool
            if (selectedUser) {
                const userDraw = currentDBState[selectedUser] || { count: 0, teams: [] };
                
                // Only restrict tiers if they have 1 team and it ISN'T a powerhouse
                if (userDraw.count === 1 && userDraw.teams.length === 1) {
                    const firstTeam = userDraw.teams[0];
                    
                    if (!top6Teams.includes(firstTeam)) {
                        if (tier1Teams.includes(firstTeam)) {
                            // First draw was a strong team (7-24) -> Force them to pull from remaining Tier 2 teams + include Top 6 Powerhouses
                            pool = pool.filter(team => tier2Teams.includes(team) || top6Teams.includes(team));
                        } else if (tier2Teams.includes(firstTeam)) {
                            // First draw was a longshot -> Force them to pull from remaining Tier 1 teams (which naturally includes Top 6)
                            pool = pool.filter(team => tier1Teams.includes(team));
                        }
                    }
                }
            }

            availableTeams = pool;
            drawWheel();
        }

        // Handle User moving to the wheel screen
        startBtn.addEventListener('click', () => {
            setupSection.classList.add('hidden');
            wheelSection.style.display = 'flex';
            welcomeUser.textContent = `Hey ${selectedUser}!`;
            updateAvailableTeams(); // Run filter specific to this user's data state
            updateUserFlowStatus();
        });

        // Handle navigation back to main dropdown setup menu
        backBtn.addEventListener('click', () => {
            if (isSpinning) return; 
            
            selectedUser = "";
            familySelect.value = "";
            startBtn.disabled = true;

            wheelSection.style.display = 'none';
            wheelSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            setupSection.classList.remove('hidden');
            
            updateAvailableTeams(); // Reset wheel to show everything globally
        });

        function updateUserFlowStatus() {
            if (!selectedUser) return;
            const userDraw = currentDBState[selectedUser] || { count: 0, teams: [] };
            const hasTop6 = userDraw.teams.some(t => top6Teams.includes(t));

            // Done if they have 2 teams, or if they have 1 team that happens to be a powerhouse
            if (userDraw.teams.length >= 2 || (userDraw.teams.length === 1 && hasTop6)) {
                userStatus.textContent = "You are all done! You have your maximum teams.";
                spinBtn.disabled = true;
                spinBtn.textContent = "No Spins Left";
                showFinalResults(userDraw.teams, hasTop6, userDraw.count);
            } else {
                const spinNum = userDraw.count + 1;
                
                if (userDraw.teams.length === 1) {
                    const firstTeam = userDraw.teams[0];
                    const tierLabel = tier1Teams.includes(firstTeam) ? "Tier 2 (Longshots) + Powerhouses" : "Tier 1 (Favorites)";
                    userStatus.textContent = `You drew ${firstTeam}. Spin #2 includes remaining ${tierLabel}!`;
                } else {
                    userStatus.textContent = `You currently have 0 teams. Ready for Spin #1!`;
                }
                
                spinBtn.disabled = isSpinning;
                spinBtn.textContent = `SPIN FOR TEAM #${spinNum}`;
            }
        }

        function showFinalResults(teams, hasTop6, spinCount) {
            resultSection.classList.remove('hidden');
            drawnTeamDisplay.innerHTML = teams.join("<br><span class='text-xl text-slate-400'>&</span><br>");
            
            if (hasTop6) {
                if (spinCount === 1) {
                    // Landed a favorite immediately on spin #1
                    ruleNotice.textContent = "⚠️ Incredible first spin! You hit a Top 6 favorite, giving you 1 powerhouse team total.";
                } else {
                    // Upgraded on spin #2
                    ruleNotice.textContent = "⚠️ You landed a Top 6 favorite! Your other team has been returned to the wheel. You get 1 powerhouse team total.";
                }
            } else {
                ruleNotice.textContent = "Nice mix! You have balanced teams from both tiers.";
            }
        }

        // --- DRAW CANVAS WHEEL ---
        function drawWheel() {
            const numSegments = availableTeams.length;
            if (numSegments === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#334155";
                ctx.font = "bold 16px sans-serif";
                ctx.fillText("No matching teams left!", 50, 140);
                return;
            }

            const arcSize = (2 * Math.PI) / numSegments;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize;
                const currentTeam = availableTeams[i];
                
                // Color Code Slices
                if (top6Teams.includes(currentTeam)) {
                    ctx.fillStyle = '#f59e0b'; // Gold for Top 6 Powerhouses
                } else if (tier1Teams.includes(currentTeam)) {
                    ctx.fillStyle = '#3b82f6'; // Deep Blue for Tier 1
                } else {
                    ctx.fillStyle = '#10b981'; // Emerald Green for Tier 2 Longshots
                }

                ctx.beginPath();
                ctx.moveTo(140, 140);
                ctx.arc(140, 140, 140, angle, angle + arcSize);
                ctx.lineTo(140, 140);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Add text labels
                ctx.save();
                ctx.fillStyle = "white";
                ctx.translate(140, 140);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.font = numSegments > 24 ? "bold 8px sans-serif" : (numSegments > 12 ? "bold 10px sans-serif" : "bold 12px sans-serif");
                ctx.fillText(currentTeam, 130, 4);
                ctx.restore();
            }
        }

        // --- SPIN LOGIC WITH CELEBRATION DELAY ---
        spinBtn.addEventListener('click', () => {
            if (isSpinning || availableTeams.length === 0) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            backBtn.disabled = true; 
            resultSection.classList.add('hidden'); 

            const numSegments = availableTeams.length;
            const winningIndex = Math.floor(Math.random() * numSegments);
            const winningTeam = availableTeams[winningIndex];

            const degreesPerSegment = 360 / numSegments;
            const targetAngle = (winningIndex * degreesPerSegment) + (degreesPerSegment / 2);
            const totalRotation = 3600 - targetAngle - 90; 

            canvas.style.transform = `rotate(${totalRotation}deg)`;

            // 1. Wheel deceleration ends (4000ms)
            setTimeout(() => {
                
                resultSection.classList.remove('hidden');
                
                const isPowerhouse = top6Teams.includes(winningTeam);
                const userDraw = currentDBState[selectedUser] || { count: 0, teams: [] };
                const isSecondSpinPowerhouse = (userDraw.teams.length === 1 && isPowerhouse);

                if (isSecondSpinPowerhouse) {
                    drawnTeamDisplay.innerHTML = `<span class='text-xs line-through text-slate-400 block'>${userDraw.teams[0]}</span>` + winningTeam;
                    ruleNotice.textContent = "💥 POWERHOUSE UPGRADE! You landed a Top 6 favorite on Spin #2! Your first team is going back on the wheel.";
                } else {
                    drawnTeamDisplay.textContent = winningTeam;
                    if (isPowerhouse) {
                        ruleNotice.textContent = "💥 Powerhouse! You drew a Top 6 favorite, which counts as your ONLY team!";
                    } else if (userDraw.teams.length === 0) {
                        const complementaryTier = tier1Teams.includes(winningTeam) ? "Tier 2 Longshot" : "Tier 1 Favorite";
                        ruleNotice.textContent = `Nice drop! Your next spin will dynamically filter to balance your options.`;
                    } else {
                        ruleNotice.textContent = "Perfect balance! You've drawn your max teams.";
                    }
                }

                // 2. DELAY PHASE: Wait 3 additional seconds
                setTimeout(async () => {
                    isSpinning = false;
                    backBtn.disabled = false; 
                    
                    canvas.style.transition = 'none';
                    const standardDegrees = (360 - targetAngle - 90) % 360;
                    canvas.style.transform = `rotate(${standardDegrees}deg)`;
                    canvas.offsetHeight; 
                    canvas.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.2, 1)';

                    // -- CRITICAL MUTATION LOGIC --
                    userDraw.count += 1;
                    
                    if (isSecondSpinPowerhouse) {
                        // Forfeit the first team back to the pool, keep only the Powerhouse
                        userDraw.teams = [winningTeam];
                    } else {
                        // Standard process: just add it
                        userDraw.teams.push(winningTeam);
                    }

                    await set(ref(db, `draws/${selectedUser}`), userDraw);
                    
                    updateAvailableTeams();
                    renderLeaderboard();
                    updateUserFlowStatus();
                }, 3000); 

            }, 4000);
        });

        // --- RENDER LIVE LEADERBOARD ---
        function renderLeaderboard() {
            leaderboard.innerHTML = "";
            
            familyMembers.forEach(member => {
                const data = currentDBState[member];
                const li = document.createElement('li');
                li.className = "py-2 flex justify-between items-center text-sm border-b border-slate-100 last:border-none";
                
                if (data && data.teams && data.teams.length > 0) {
                    const cleanTeams = data.teams.map(t => top6Teams.includes(t) ? `⭐ ${t}` : t).join(', ');
                    li.innerHTML = `<span class="font-semibold text-slate-700">${member}</span> <span class="text-emerald-600 font-bold text-right">${cleanTeams}</span>`;
                } else {
                    li.innerHTML = `<span class="font-normal text-slate-400">${member}</span> <span class="text-slate-400 italic text-xs">Hasn't spun yet</span>`;
                }
                leaderboard.appendChild(li);
            });
        }
    </script>
</body>
</html>
